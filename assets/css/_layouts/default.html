<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="container">
    <header>
      <nav>
        {% for path in site.header_pages %}
          {% assign my_page = site.pages | where: "name", path | first %}
          {% if my_page %}
            <a href="{{ my_page.url | relative_url }}">
              {{ my_page.title | default: my_page.name | replace: '.md', '' | capitalize }}
            </a>
          {% endif %}
        {% endfor %}
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
  </div>
</body>
</html>
